title: APX.
description: "RevOps technology agency. We architect, integrate and run the systems your revenue engine depends on, on the stack you already run."
url: "https://apx-revops.com"
baseurl: ""

# Author defaults for SEO
author:
  name: APX Team
  twitter: apxrevops

# Social profiles for SEO
social:
  name: APX.
  links:
    - https://www.linkedin.com/company/apx-revops-ltd/

# ── Central CTA + contact config ─────────────────────────────
# Every call-to-action, phone, and email on the site reads from here.
# Change a link in ONE place and it updates everywhere.
cta:
  # Primary conversion across the whole site: the fixed-price audit.
  primary_url: "https://calendly.com/apx-revops/audit-scoping?utm_source=website&utm_content=global-audit-cta"
  primary_label: "Book the €2,450 Audit"
  primary_short: "Book the Audit"
  # Free intro call ("Kostenloses Erstgespräch"), the primary action in the
  # header + hero. No price attached; pricing lives on the service pages.
  secondary_url: "https://calendly.com/apx-revops/intro-call?utm_source=website&utm_content=global-intro-cta"
  secondary_label: "Free intro call"

contact:
  email: "support@apx-revops.com"
  phone_display: "+49 402 2632 0690"
  phone_href: "tel:+4940226320690"
  linkedin: "https://www.linkedin.com/company/apx-revops-ltd/"

# Company / legal identity
company:
  legal_name: "APX REVOPS LTD"
  reg: "HE490307"
  address: "Gladstonos 16, 8046 Paphos, Cyprus"

# Clean URL structure for blog posts
permalink: /articles/:title/

# Collections configuration
collections:
  services:
    output: true
    permalink: /services/:title/
  case_studies:
    output: true
    permalink: /cases/:title/
  revshorts:
    output: true
    permalink: /revshorts/:name/
  revshorts_de:
    output: true
    permalink: /de/revshorts/:name/
  industries:
    output: true
    permalink: /industries/:name/
  solutions:
    output: true
    permalink: /solutions/:name/
  industries_de:
    output: true
    permalink: /de/branchen/:name/
  solutions_de:
    output: true
    permalink: /de/loesungen/:name/

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
exclude:
  - node_modules
  - package.json
  - package-lock.json
  - README.md
  - catalog
  - GEMINI_SERVICE_CATALOG_PROMPT.md
  - instruction
  - lumos-backend-spec.md
  - design
  - corpo_design
  - content
  - docs
  - scripts
  - _tools
  - _revshorts_source
  - jekyll_context.txt
  - bundle.sh
  - aircall.svg
  - Gemfile
  - Gemfile.lock
  - netlify.toml