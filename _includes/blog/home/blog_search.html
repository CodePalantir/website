<!-- SEARCH BAR -->
<section class="px-6 pb-12 bg-slate-50 backdrop-blur-md bg-slate-50/90">
    <div class="max-w-2xl mx-auto">
        <div class="relative group">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                <i data-lucide="search" class="h-5 w-5 text-slate-400 group-focus-within:text-[#8E2DE2] transition-colors"></i>
            </div>
            <input type="text"
                    id="blog-search-input"
                    class="block w-full pl-11 pr-4 py-4 border border-slate-200 rounded-2xl leading-5 bg-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-[#8E2DE2] focus:border-transparent sm:text-sm shadow-sm transition-all cursor-text"
                    placeholder="Search for strategies, topics, or keywords..."
            >
            <div class="absolute inset-y-0 right-0 pr-2 flex items-center">
                    <button id="clear-search" class="p-2 text-slate-400 hover:text-slate-600 cursor-pointer hidden">
                        <i data-lucide="x" class="h-5 w-5"></i>
                    </button>
            </div>
        </div>
        <div id="category-filters" class="flex gap-2 mt-4 justify-center overflow-x-auto no-scrollbar">
            <button data-category="all" class="category-filter-btn px-4 py-1.5 rounded-full border text-xs font-bold transition-colors whitespace-nowrap cursor-pointer bg-[#8E2DE2] border-[#8E2DE2] text-white">All</button>
            <button data-category="Strategy" class="category-filter-btn px-4 py-1.5 rounded-full bg-white border border-slate-200 text-xs font-bold text-slate-600 hover:border-[#8E2DE2] hover:text-[#8E2DE2] transition-colors whitespace-nowrap cursor-pointer">Strategy</button>
            <button data-category="ROI" class="category-filter-btn px-4 py-1.5 rounded-full bg-white border border-slate-200 text-xs font-bold text-slate-600 hover:border-[#8E2DE2] hover:text-[#8E2DE2] transition-colors whitespace-nowrap cursor-pointer">ROI</button>
            <button data-category="Leadership" class="category-filter-btn px-4 py-1.5 rounded-full bg-white border border-slate-200 text-xs font-bold text-slate-600 hover:border-[#8E2DE2] hover:text-[#8E2DE2] transition-colors whitespace-nowrap cursor-pointer">Leadership</button>
            <button data-category="Data" class="category-filter-btn px-4 py-1.5 rounded-full bg-white border border-slate-200 text-xs font-bold text-slate-600 hover:border-[#8E2DE2] hover:text-[#8E2DE2] transition-colors whitespace-nowrap cursor-pointer">Data</button>
        </div>
    </div>
</section>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const searchInput = document.getElementById('blog-search-input');
    const clearBtn = document.getElementById('clear-search');
    const categoryBtns = document.querySelectorAll('.category-filter-btn');
    const postCards = document.querySelectorAll('.blog-post-card');
    let activeCategory = 'all';

    // Search functionality
    if (searchInput) {
        searchInput.addEventListener('input', function() {
            const query = this.value.toLowerCase().trim();
            if (clearBtn) clearBtn.classList.toggle('hidden', query.length === 0);
            filterPosts(query, activeCategory);
        });
    }

    // Clear search
    if (clearBtn) {
        clearBtn.addEventListener('click', function() {
            searchInput.value = '';
            clearBtn.classList.add('hidden');
            filterPosts('', activeCategory);
        });
    }

    // Category filter functionality
    categoryBtns.forEach(btn => {
        btn.addEventListener('click', function() {
            activeCategory = this.dataset.category;

            // Update button styles
            categoryBtns.forEach(b => {
                b.classList.remove('bg-[#8E2DE2]', 'border-[#8E2DE2]', 'text-white');
                b.classList.add('bg-white', 'border-slate-200', 'text-slate-600');
            });
            this.classList.remove('bg-white', 'border-slate-200', 'text-slate-600');
            this.classList.add('bg-[#8E2DE2]', 'border-[#8E2DE2]', 'text-white');

            filterPosts(searchInput ? searchInput.value.toLowerCase().trim() : '', activeCategory);
        });
    });

    function filterPosts(query, category) {
        postCards.forEach(card => {
            const title = (card.dataset.title || '').toLowerCase();
            const cardCategory = card.dataset.category || '';
            const excerpt = (card.dataset.excerpt || '').toLowerCase();

            const matchesSearch = query === '' || title.includes(query) || excerpt.includes(query);
            const matchesCategory = category === 'all' || cardCategory === category;

            card.style.display = (matchesSearch && matchesCategory) ? '' : 'none';
        });
    }

    // Initialize Lucide icons for clear button
    if (typeof lucide !== 'undefined') {
        lucide.createIcons();
    }
});
</script>
