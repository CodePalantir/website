<!-- SEARCH BAR -->
<section class="px-6 pb-12 bg-slate-50 backdrop-blur-md bg-slate-50/90">
    <div class="max-w-2xl mx-auto">
        <div class="relative group">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                <i data-lucide="search" class="h-5 w-5 text-slate-400 group-focus-within:text-[#8E2DE2] transition-colors"></i>
            </div>
            <input type="text" 
                    class="block w-full pl-11 pr-4 py-4 border border-slate-200 rounded-2xl leading-5 bg-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-[#8E2DE2] focus:border-transparent sm:text-sm shadow-sm transition-all" 
                    placeholder="Search for strategies, topics, or keywords..."
            >
            <div class="absolute inset-y-0 right-0 pr-2 flex items-center">
                    <button class="p-2 text-slate-400 hover:text-slate-600">
                        <i data-lucide="sliders-horizontal" class="h-5 w-5"></i>
                    </button>
            </div>
        </div>
        <div class="flex gap-2 mt-4 justify-center overflow-x-auto no-scrollbar">
            <button class="px-4 py-1.5 rounded-full bg-white border border-slate-200 text-xs font-bold text-slate-600 hover:border-[#8E2DE2] hover:text-[#8E2DE2] transition-colors whitespace-nowrap">All</button>
            <button class="px-4 py-1.5 rounded-full bg-white border border-slate-200 text-xs font-bold text-slate-600 hover:border-[#8E2DE2] hover:text-[#8E2DE2] transition-colors whitespace-nowrap">Strategy</button>
            <button class="px-4 py-1.5 rounded-full bg-white border border-slate-200 text-xs font-bold text-slate-600 hover:border-[#8E2DE2] hover:text-[#8E2DE2] transition-colors whitespace-nowrap">ROI</button>
            <button class="px-4 py-1.5 rounded-full bg-white border border-slate-200 text-xs font-bold text-slate-600 hover:border-[#8E2DE2] hover:text-[#8E2DE2] transition-colors whitespace-nowrap">Leadership</button>
            <button class="px-4 py-1.5 rounded-full bg-white border border-slate-200 text-xs font-bold text-slate-600 hover:border-[#8E2DE2] hover:text-[#8E2DE2] transition-colors whitespace-nowrap">Data</button>
        </div>
    </div>
</section>
