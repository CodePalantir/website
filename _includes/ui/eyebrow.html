{%- comment -%}
  Mono structural label. Optional index number reads like a doc reference.
  Usage: {% include ui/eyebrow.html text="What we do" %}
         {% include ui/eyebrow.html text="What we do" idx="02" %}
{%- endcomment -%}
<span class="apx-label {{ include.class }}">{%- if include.idx -%}<span class="idx">{{ include.idx }}</span>{%- endif -%}{{ include.text }}</span>
