{%- comment -%}
  Quiet client logo strip — grayscale, multiply-blended onto the warm ground.
{%- endcomment -%}
<section class="px-6 pb-20 md:pb-[7.5rem] bg-paper">
  <div class="max-w-wide mx-auto rv">
    <p class="text-center text-sm font-semibold uppercase tracking-[0.1em] text-faint">Trusted by teams at</p>
    <div class="mt-9 flex items-center justify-center flex-wrap gap-x-8 gap-y-6 md:gap-x-16">
      <img class="h-9 md:h-12 w-auto grayscale opacity-60 mix-blend-multiply hover:opacity-90 transition-opacity" src="{{ '/assets/images/clients/zech.webp' | relative_url }}" alt="Zech Group" loading="lazy">
      <img class="h-9 md:h-[46px] w-auto grayscale opacity-60 mix-blend-multiply hover:opacity-90 transition-opacity" src="{{ '/assets/images/clients/eigenherd.webp' | relative_url }}" alt="Eigenherd" loading="lazy">
      <img class="h-6 md:h-7 w-auto grayscale opacity-60 mix-blend-multiply hover:opacity-90 transition-opacity" src="{{ '/assets/images/clients/liqid.webp' | relative_url }}" alt="LIQID" loading="lazy">
      <img class="h-6 md:h-[30px] w-auto grayscale opacity-60 mix-blend-multiply hover:opacity-90 transition-opacity" src="{{ '/assets/images/clients/eventinc_log.webp' | relative_url }}" alt="Event Inc" loading="lazy">
      <img class="h-16 md:h-[84px] w-auto grayscale opacity-60 mix-blend-multiply hover:opacity-90 transition-opacity" src="{{ '/assets/images/clients/iu.webp' | relative_url }}" alt="IU International University" loading="lazy">
      <img class="h-8 md:h-10 w-auto grayscale opacity-60 mix-blend-multiply hover:opacity-90 transition-opacity" src="{{ '/assets/images/clients/hauser.webp' | relative_url }}" alt="Hauser Maschinen" loading="lazy">
    </div>
  </div>
</section>
