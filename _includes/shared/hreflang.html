{%- comment -%}
  hreflang pair annotations. Emitted only when the page declares a
  `translation:` twin. English is always x-default.
{%- endcomment -%}
{%- if page.translation -%}
{%- if page.lang == "de" -%}
<link rel="alternate" hreflang="de" href="{{ page.url | absolute_url }}">
<link rel="alternate" hreflang="en" href="{{ page.translation | absolute_url }}">
<link rel="alternate" hreflang="x-default" href="{{ page.translation | absolute_url }}">
{%- else -%}
<link rel="alternate" hreflang="en" href="{{ page.url | absolute_url }}">
<link rel="alternate" hreflang="de" href="{{ page.translation | absolute_url }}">
<link rel="alternate" hreflang="x-default" href="{{ page.url | absolute_url }}">
{%- endif -%}
{%- endif -%}
