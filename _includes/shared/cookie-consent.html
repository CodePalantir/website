{%- assign t = site.data.i18n[page.lang] | default: site.data.i18n.en -%}
<!-- Cookie Consent Banner -->
<div id="cookie-consent" class="fixed bottom-0 left-0 right-0 z-50 p-4 transform translate-y-full transition-transform duration-300">
  <div class="max-w-4xl mx-auto bg-white rounded-2xl shadow-2xl border border-slate-200 p-6">
    <div class="flex flex-col sm:flex-row items-start sm:items-center gap-4">
      <div class="flex-1">
        <p class="text-slate-700 text-sm">
          {{ t.cookie.text }}
          <a href="{{ t.urls.privacy | relative_url }}" class="text-purple-600 hover:underline">{{ t.cookie.learn_more }}</a>
        </p>
      </div>
      <div class="flex gap-3 shrink-0">
        <button id="cookie-decline" class="px-4 py-2 text-sm font-semibold text-slate-600 hover:text-slate-800 transition-colors">
          {{ t.cookie.decline }}
        </button>
        <button id="cookie-accept" class="px-5 py-2 bg-ink text-white text-sm font-semibold rounded-[0.5rem] hover:bg-black transition-colors">
          {{ t.cookie.accept }}
        </button>
      </div>
    </div>
  </div>
</div>

<script>
// Cookie Consent Management
(function() {
  // v2: consent scope grew (analytics -> analytics + LinkedIn marketing),
  // so earlier consents don't cover it; the new name re-prompts everyone once.
  const CONSENT_COOKIE = 'apx_consent_v2';
  const CONSENT_DURATION = 365; // days

  // Cookie utilities
  function setCookie(name, value, days) {
    const expires = new Date(Date.now() + days * 864e5).toUTCString();
    document.cookie = name + '=' + encodeURIComponent(value) + '; expires=' + expires + '; path=/; SameSite=Lax';
  }

  function getCookie(name) {
    const value = document.cookie.split('; ').find(row => row.startsWith(name + '='));
    return value ? decodeURIComponent(value.split('=')[1]) : null;
  }

  // Initialize custom analytics (called after consent)
  function initCustomAnalytics() {
    // APX Lumos disabled, re-enable by uncommenting the block below
    /*
    const script = document.createElement('script');
    script.src = '{{ "/assets/js/apx-lumos.js" | relative_url }}';
    script.onload = function() {
      if (window.APX) {
        window.APX.init();
        console.log('[Analytics] APX tracker initialized');
      }
    };
    document.head.appendChild(script);
    */

    // LinkedIn Insight Tag. Consent-gated: this function only runs after
    // "Accept" (or a stored accepted consent), matching privacy policy 2.4.
    if (!window._apx_li_loaded) {
      window._apx_li_loaded = true;
      window._linkedin_partner_id = "9400002";
      window._linkedin_data_partner_ids = window._linkedin_data_partner_ids || [];
      window._linkedin_data_partner_ids.push(window._linkedin_partner_id);
      (function(l) {
        if (!l){window.lintrk = function(a,b){window.lintrk.q.push([a,b])}; window.lintrk.q=[]}
        var s = document.getElementsByTagName("script")[0];
        var b = document.createElement("script");
        b.type = "text/javascript"; b.async = true;
        b.src = "https://snap.licdn.com/li.lms-analytics/insight.min.js";
        s.parentNode.insertBefore(b, s);
      })(window.lintrk);
    }

    // Dispatch event for external listeners
    window.dispatchEvent(new CustomEvent('analyticsConsent', { detail: { accepted: true } }));
  }

  // Show/hide banner
  function showBanner() {
    const banner = document.getElementById('cookie-consent');
    if (banner) {
      setTimeout(() => banner.classList.remove('translate-y-full'), 500);
    }
  }

  function hideBanner() {
    const banner = document.getElementById('cookie-consent');
    if (banner) {
      banner.classList.add('translate-y-full');
    }
  }

  // Handle consent
  function acceptCookies() {
    setCookie(CONSENT_COOKIE, 'accepted', CONSENT_DURATION);
    hideBanner();
    initCustomAnalytics();
  }

  function declineCookies() {
    setCookie(CONSENT_COOKIE, 'declined', CONSENT_DURATION);
    hideBanner();
    window.dispatchEvent(new CustomEvent('analyticsConsent', { detail: { accepted: false } }));
  }

  // Check existing consent on load
  function checkConsent() {
    const consent = getCookie(CONSENT_COOKIE);

    if (consent === 'accepted') {
      initCustomAnalytics();
    } else if (consent === 'declined') {
      // User previously declined, do nothing
    } else {
      // No decision yet, show banner
      showBanner();
    }
  }

  // Initialize
  document.addEventListener('DOMContentLoaded', function() {
    const acceptBtn = document.getElementById('cookie-accept');
    const declineBtn = document.getElementById('cookie-decline');

    if (acceptBtn) acceptBtn.addEventListener('click', acceptCookies);
    if (declineBtn) declineBtn.addEventListener('click', declineCookies);

    checkConsent();
  });

  // Expose for external use
  window.CookieConsent = {
    hasConsent: function() { return getCookie(CONSENT_COOKIE) === 'accepted'; },
    reset: function() {
      document.cookie = CONSENT_COOKIE + '=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
      location.reload();
    }
  };
})();
</script>
