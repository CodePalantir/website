<!-- BreadcrumbList Schema for SEO -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {
      "@type": "ListItem",
      "position": 1,
      "name": "Home",
      "item": "{{ site.url }}/"
    },
    {
      "@type": "ListItem",
      "position": 2,
      "name": "Insights",
      "item": "{{ site.url }}/blog"
    }{% if page.category %},
    {
      "@type": "ListItem",
      "position": 3,
      "name": "{{ page.category }}",
      "item": "{{ page.url | absolute_url }}"
    }{% endif %}
  ]
}
</script>

<!-- BREADCRUMBS -->
<div class="pt-32 pb-8 px-6 bg-white border-b border-slate-50">
    <div class="max-w-7xl mx-auto flex items-center gap-2 text-xs font-bold text-slate-400 uppercase tracking-widest">
        <a href="/blog" class="hover:text-purple-600 transition-colors">Insights</a>
        <i data-lucide="chevron-right" class="w-3 h-3"></i>
        <span class="text-purple-600">{{ page.category | default: "Article" }}</span>
    </div>
</div>
