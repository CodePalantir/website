<section class="py-12 border-y border-slate-100 bg-white overflow-hidden">
  <div class="max-w-7xl mx-auto px-6 mb-8 text-center text-xs font-bold uppercase tracking-[0.2em] text-slate-600">Trusted by Forward-Thinking Leaders</div>
  <div class="flex overflow-hidden whitespace-nowrap relative">
    <div class="flex gap-16 items-center logo-scroll">
      <img src="{{ '/assets/images/clients/zech.webp' | relative_url }}" alt="Zech" class="h-10 w-auto grayscale opacity-60" loading="lazy" decoding="async">
      <img src="{{ '/assets/images/clients/eigenherd.webp' | relative_url }}" alt="Eigenherd" class="h-10 w-auto grayscale opacity-60" loading="lazy" decoding="async">
      <img src="{{ '/assets/images/clients/liqid.webp' | relative_url }}" alt="LIQID" class="h-10 w-auto grayscale opacity-60" loading="lazy" decoding="async">
      <img src="{{ '/assets/images/clients/eventinc_log.webp' | relative_url }}" alt="EventInc" class="h-10 w-auto grayscale opacity-60" loading="lazy" decoding="async">
      <img src="{{ '/assets/images/clients/iu.webp' | relative_url }}" alt="IU" class="h-16 w-auto grayscale opacity-60" loading="lazy" decoding="async">
      <img src="{{ '/assets/images/clients/hauser.webp' | relative_url }}" alt="Hauser Maschinen" class="h-10 w-auto grayscale opacity-60" loading="lazy" decoding="async">
    </div>
  </div>

  <script>
  (function() {
    // Respect reduced motion preference
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

    const scrollContainer = document.querySelector('.logo-scroll');
    if (!scrollContainer) return;

    const scrollContent = scrollContainer.innerHTML;
    scrollContainer.innerHTML = scrollContent + scrollContent + scrollContent;

    let scrollAmount = 0;
    const scrollSpeed = 0.25;
    let isVisible = false;
    let animationId = null;

    function animate() {
      if (!isVisible) return;

      scrollAmount += scrollSpeed;
      const maxScroll = scrollContainer.scrollWidth / 3;

      if (scrollAmount >= maxScroll) {
        scrollAmount = 0;
      }

      scrollContainer.style.transform = `translateX(-${scrollAmount}px)`;
      animationId = requestAnimationFrame(animate);
    }

    // Use IntersectionObserver to only animate when visible
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        isVisible = entry.isIntersecting;
        if (isVisible && !animationId) {
          animationId = requestAnimationFrame(animate);
        } else if (!isVisible && animationId) {
          cancelAnimationFrame(animationId);
          animationId = null;
        }
      });
    }, { threshold: 0.1 });

    observer.observe(scrollContainer.parentElement);
  })();
  </script>
</section>
