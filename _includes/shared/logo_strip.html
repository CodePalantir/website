<section class="py-12 border-y border-slate-100 bg-white overflow-hidden">
  <div class="max-w-7xl mx-auto px-6 mb-8 text-center text-xs font-bold uppercase tracking-[0.2em] text-slate-600">Trusted by Forward-Thinking Leaders</div>
  <div class="flex overflow-hidden whitespace-nowrap relative">
    <div class="flex gap-16 items-center grayscale logo-scroll text-slate-500">
      <div class="flex items-center gap-2 text-2xl font-black italic tracking-tighter px-4 select-none whitespace-nowrap"><div class="w-10 h-10 rounded bg-slate-200 flex items-center justify-center text-[10px] text-slate-800 font-bold not-italic">GT</div>GlobalTech #1</div>
      <div class="flex items-center gap-2 text-2xl font-black italic tracking-tighter px-4 select-none whitespace-nowrap"><div class="w-10 h-10 rounded bg-slate-200 flex items-center justify-center text-[10px] text-slate-800 font-bold not-italic">AF</div>ApexFlow</div>
      <div class="flex items-center gap-2 text-2xl font-black italic tracking-tighter px-4 select-none whitespace-nowrap"><div class="w-10 h-10 rounded bg-slate-200 flex items-center justify-center text-[10px] text-slate-800 font-bold not-italic">CS</div>CloudScale</div>
      <div class="flex items-center gap-2 text-2xl font-black italic tracking-tighter px-4 select-none whitespace-nowrap"><div class="w-10 h-10 rounded bg-slate-200 flex items-center justify-center text-[10px] text-slate-800 font-bold not-italic">DB</div>DataBridge</div>
      <div class="flex items-center gap-2 text-2xl font-black italic tracking-tighter px-4 select-none whitespace-nowrap"><div class="w-10 h-10 rounded bg-slate-200 flex items-center justify-center text-[10px] text-slate-800 font-bold not-italic">LG</div>LogicGate</div>
    </div>
  </div>

  <script>
  (function() {
    // Respect reduced motion preference
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

    const scrollContainer = document.querySelector('.logo-scroll');
    if (!scrollContainer) return;

    const scrollContent = scrollContainer.innerHTML;
    scrollContainer.innerHTML = scrollContent + scrollContent + scrollContent;

    let scrollAmount = 0;
    const scrollSpeed = 0.5;
    let isVisible = false;
    let animationId = null;

    function animate() {
      if (!isVisible) return;

      scrollAmount += scrollSpeed;
      const maxScroll = scrollContainer.scrollWidth / 3;

      if (scrollAmount >= maxScroll) {
        scrollAmount = 0;
      }

      scrollContainer.style.transform = `translateX(-${scrollAmount}px)`;
      animationId = requestAnimationFrame(animate);
    }

    // Use IntersectionObserver to only animate when visible
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        isVisible = entry.isIntersecting;
        if (isVisible && !animationId) {
          animationId = requestAnimationFrame(animate);
        } else if (!isVisible && animationId) {
          cancelAnimationFrame(animationId);
          animationId = null;
        }
      });
    }, { threshold: 0.1 });

    observer.observe(scrollContainer.parentElement);
  })();
  </script>
</section>
