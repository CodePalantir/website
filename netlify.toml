[build]
  command = "npm install --no-audit --no-fund && npm run build:css && bundle exec jekyll build"
  publish = "_site"

[build.environment]
  JEKYLL_ENV = "production"
  NODE_VERSION = "20"

# Caching: fonts never change under the same filename; images/diagrams may be
# re-exported under the same name, so a week + revalidation. CSS and HTML keep
# Netlify's default ETag revalidation for instant freshness after deploys.
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/assets/diagrams/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Sample PDFs renamed from the old brand
[[redirects]]
  from = "/assets/content/Technical-Health-Audit-ApexPalantir.pdf"
  to = "/assets/content/Technical-Health-Audit-APX.pdf"
  status = 301

[[redirects]]
  from = "/assets/content/Data-Quality-Check-ApexPalantir.pdf"
  to = "/assets/content/Data-Quality-Check-APX.pdf"
  status = 301

# /blog moved to /articles (old site URLs stay valid)
[[redirects]]
  from = "/blog"
  to = "/articles"
  status = 301

[[redirects]]
  from = "/blog/*"
  to = "/articles/:splat"
  status = 301

# DACH steering: German-preferring browsers land on /de/ (homepage only,
# 302, overridable via the nf_lang cookie set by the language switcher).
[[redirects]]
  from = "/"
  to = "/de/"
  status = 302
  conditions = {Language = ["de"]}
