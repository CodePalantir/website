<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  {% seo %}

  <!-- Favicon & PWA -->
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/images/favicon-32x32.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ '/assets/images/favicon-16x16.png' | relative_url }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/images/apple-touch-icon.png' | relative_url }}">
  <link rel="manifest" href="{{ '/site.webmanifest' | relative_url }}">
  <meta name="theme-color" content="#8E2DE2">

  <!-- Preload critical resources for faster rendering -->
  <link rel="preload" href="{{ '/assets/css/tailwind.css' | relative_url }}" as="style">
  <link rel="preload" href="{{ '/assets/fonts/plus-jakarta-sans.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>

  <!-- Tailwind Output -->
  <link rel="stylesheet" href="{{ '/assets/css/tailwind.css' | relative_url }}">

  <!-- Preconnect for external images (team photos) -->
  <link rel="dns-prefetch" href="https://media.licdn.com">
  <link rel="dns-prefetch" href="https://i.pravatar.cc">
  <link rel="preconnect" href="https://media.licdn.com" crossorigin>
  <link rel="preconnect" href="https://i.pravatar.cc" crossorigin>

  <!-- Preload critical logo (mobile gets smaller version) -->
  <link rel="preload" as="image" href="{{ '/assets/images/logos/APEX-PALANTIR_MOBILE.webp' | relative_url }}" media="(max-width: 767px)">
  <link rel="preload" as="image" href="{{ '/assets/images/logos/APEX-PALANTIR_72ppi.png' | relative_url }}" media="(min-width: 768px)">

  {% if page.url == '/about' or page.url == '/about/' %}
  <!-- Preload LCP image for about page -->
  <link rel="preload" as="image" href="{{ '/assets/images/people/alex-knoll.webp' | relative_url }}" type="image/webp">
  {% endif %}

  <!-- Icons (fonts now self-hosted in tailwind.css) -->
  <script src="{{ '/assets/js/lucide.min.js' | relative_url }}" defer></script>

  <!-- Fathom - beautiful, simple website analytics -->
  <script src="https://cdn.usefathom.com/script.js" data-site="SSUCTAAP" defer></script>
  <!-- / Fathom -->

  <!-- APX Lumos Light -->
  <script>window.APX_SITE='apex-palantir.com';</script>
  <script src="{{ '/assets/js/apx-lumos-light.js' | relative_url }}" defer></script>
</head>
<body class="min-h-screen bg-white text-slate-900 selection:bg-purple-100">

  {% include shared/header.html %}

  <main>
    {{ content }}
  </main>

  {% include shared/footer.html %}

  <script>
    // Initialize Lucide Icons (after deferred script loads)
    document.addEventListener('DOMContentLoaded', () => {
      if (typeof lucide !== 'undefined') {
        lucide.createIcons();
      }
    });

    // Scroll Logic (Glass Effect)
    const navbar = document.getElementById('navbar');
    window.addEventListener('scroll', () => {
      if (window.scrollY > 20) {
        navbar.classList.add('bg-white/80', 'backdrop-blur-md', 'border-b', 'border-slate-100', 'shadow-sm', 'py-3');
        navbar.classList.remove('py-4', 'bg-white');
      } else {
        navbar.classList.remove('bg-white/80', 'backdrop-blur-md', 'border-b', 'border-slate-100', 'shadow-sm', 'py-3');
        navbar.classList.add('py-4', 'bg-white');
      }
    });

    // Navigation Logic
    function navigateTo(pageId) {

        // Re-render icons
        setTimeout(() => {
            lucide.createIcons();
        }, 50);
    }

    // Team Member Image Scroll Animation - Only one highlighted at a time
    let currentHighlightedImage = null;
    let scrollTimeout = null;

    function updateTeamHighlight() {
      const teamImages = document.querySelectorAll('.team-member-img');
      if (teamImages.length === 0) return;

      const viewportCenter = window.innerHeight / 2;
      let closestImage = null;
      let minDistance = Infinity;

      // Find the image closest to the center of the viewport
      teamImages.forEach(img => {
        const rect = img.getBoundingClientRect();
        const imageCenter = rect.top + rect.height / 2;
        const distance = Math.abs(imageCenter - viewportCenter);

        if (distance < minDistance) {
          minDistance = distance;
          closestImage = img;
        }
      });

      // Only switch if the closest image is different AND reasonably close to center
      // Hysteresis: require 100px closer to switch
      if (closestImage && closestImage !== currentHighlightedImage) {
        const currentDistance = currentHighlightedImage ?
          Math.abs(currentHighlightedImage.getBoundingClientRect().top +
                   currentHighlightedImage.getBoundingClientRect().height / 2 - viewportCenter) :
          Infinity;

        // Switch only if new image is significantly closer (100px hysteresis)
        if (minDistance < currentDistance - 100 || !currentHighlightedImage) {
          teamImages.forEach(img => {
            if (img === closestImage) {
              img.classList.remove('grayscale');
              img.classList.add('scale-105');
            } else {
              img.classList.add('grayscale');
              img.classList.remove('scale-105');
            }
          });
          currentHighlightedImage = closestImage;
        }
      }
    }

    // Throttled scroll handler
    function handleTeamScroll() {
      if (scrollTimeout) return;

      scrollTimeout = setTimeout(() => {
        updateTeamHighlight();
        scrollTimeout = null;
      }, 50);
    }

    // Initialize on load and update on scroll
    document.addEventListener('DOMContentLoaded', () => {
      updateTeamHighlight();
      window.addEventListener('scroll', handleTeamScroll);
    });

    // Reading Progress Bar Logic
    window.addEventListener('scroll', () => {
        const progressBar = document.getElementById('reading-progress');

        // Only run if progress bar exists (on article pages)
        if (!progressBar) return;

        // Calculate scroll progress relative to the document height
        const totalHeight = document.documentElement.scrollHeight - window.innerHeight;
        const scrollPosition = window.scrollY;

        // Prevent division by zero and calculate progress
        if (totalHeight > 0) {
            const progress = Math.min((scrollPosition / totalHeight) * 100, 100);
            progressBar.style.width = `${progress}%`;
        } else {
            progressBar.style.width = '0%';
        }
    });

    // Reset progress bar on page load
    document.addEventListener('DOMContentLoaded', () => {
        const progressBar = document.getElementById('reading-progress');
        if (progressBar) {
            progressBar.style.width = '0%';
        }
    });

    // Table of Contents Active Section Highlighting
    function updateActiveTocLink() {
        const tocLinks = document.querySelectorAll('.toc-link');
        if (tocLinks.length === 0) return;

        const headings = Array.from(tocLinks).map(link => {
            const id = link.getAttribute('href').substring(1);
            return document.getElementById(id);
        }).filter(heading => heading !== null);

        if (headings.length === 0) return;

        // Find the heading that's currently in view (with offset for navbar)
        const scrollPosition = window.scrollY + 150; // Offset for navbar
        let currentHeading = headings[0];

        for (let i = headings.length - 1; i >= 0; i--) {
            if (headings[i].offsetTop <= scrollPosition) {
                currentHeading = headings[i];
                break;
            }
        }

        // Update active state
        tocLinks.forEach(link => {
            const id = link.getAttribute('href').substring(1);
            if (id === currentHeading.id) {
                link.classList.add('toc-active');
            } else {
                link.classList.remove('toc-active');
            }
        });
    }

    // Update TOC on scroll
    window.addEventListener('scroll', updateActiveTocLink);
    document.addEventListener('DOMContentLoaded', updateActiveTocLink);
  </script>

</body>
</html>
